use_case: decision_support
description: Internal decision-support tool in a regulated workflow
latency_budget_ms: 3000
min_band: medium                    # never runs in LOW
uncertainty_margin: 0.08            # INV-2 rounding zone
regulated: true

bands:
  medium: { holdback_tokens: 64,  sync: false, guard_budget_ms: 120 }
  high:   { holdback_tokens: 256, sync: true,  guard_budget_ms: 400 }

band_thresholds:
  medium: 0.25
  high: 0.55

detectors:
  floor: [pii, injection]           # always on, all bands
  medium: [groundedness]
  high: [groundedness, consistency, bias]

masking_enabled: true
require_masking: true

escalation:
  budget: 0.06                      # target share of traffic to humans
  queue: decision_review

bias:
  protected_attributes: [gender, age, ethnicity, disability, marital_status]
  decision_context: true

geography:
  IN: { pii_entities: [PAN, AADHAAR, PHONE_IN, EMAIL, ACCOUNT] }
  EU: { pii_entities: [EMAIL, PHONE, IBAN, NATIONAL_ID], require_ledger: true }
  US: { pii_entities: [EMAIL, PHONE, NATIONAL_ID, CREDIT_CARD], require_ledger: true }

conversation:
  ratchet_half_life_turns: 4
  tool_write_forces_high: true

routing:
  cheap_model: replay-cheap
  frontier_model: replay-frontier
  complexity_threshold: 0.40
  cache_similarity: 0.94

regenerate:
  enabled: true
  max_attempts: 1
  min_headroom_ms: 900

regulated_topics:
  - credit limit
  - loan application
  - underwriting
  - claim denial
  - hiring decision
  - promotion
  - termination
  - risk rating
  - eligibility
  - sanction

risky_prompt_examples:
  - should we approve this loan application for the applicant
  - recommend whether to extend the credit limit for this customer
  - assess whether this candidate should be shortlisted for the role
  - decide if this insurance claim should be denied based on the file
  - rank these applicants and justify the ordering
